<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#146c5a">
  <meta name="description" content="六項電商營運公式，快速試算毛利、定價、損益兩平與預估業績。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>電商營運計算助手</title>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-mark" aria-hidden="true">營</div>
      <div class="brand-copy">
        <p class="eyebrow">ECOMMERCE TOOLKIT</p>
        <h1>電商營運計算助手</h1>
      </div>
      <span class="network-status" id="network-status" role="status"><i></i><span>可離線使用</span></span>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="intro-title">
      <div>
        <p class="section-kicker">把複雜公式，變成清楚答案</p>
        <h2 id="intro-title">輸入數字，立即掌握營運關鍵。</h2>
        <p>資料只留在這台裝置，不會上傳。選擇一項工具開始試算。</p>
      </div>
      <button class="install-button" id="install-button" hidden>安裝到手機</button>
    </section>

    <nav class="tool-nav" id="tool-nav" aria-label="計算工具捷徑"></nav>

    <section class="workspace" aria-labelledby="workspace-title">
      <div class="section-heading">
        <div>
          <p class="section-kicker">六大營運公式</p>
          <h2 id="workspace-title">開始試算</h2>
        </div>
        <div class="actions">
          <button class="text-button" id="reset-button">恢復範例值</button>
          <button class="text-button danger" id="clear-button">全部清除</button>
        </div>
      </div>
      <div class="calculators" id="calculators"></div>
    </section>

    <section class="future-section" aria-labelledby="future-title">
      <span class="future-index">07+</span>
      <div>
        <p class="section-kicker">持續擴充</p>
        <h2 id="future-title">更多營運工具，從這裡長出來。</h2>
        <p>未來可加入廣告投報率、庫存週轉、平台抽成與多組商品比較。</p>
      </div>
    </section>
  </main>

  <footer>
    <p>電商營運計算助手</p>
    <p>版本 <span id="version">1.0.0</span> · 所有計算皆在裝置端完成</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
